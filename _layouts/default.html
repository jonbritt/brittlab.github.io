{%- include page-vars.html -%}
<!doctype html>
<html lang="{{ lang }}" class="no-js">
<head>
{% include head.html %}
</head>
<body class="page-{{ page.ref | default: 'post' }}">
  <a class="skip-link" href="#main">{{ t.skip_link }}</a>
  {% include nav.html %}
  <main id="main" tabindex="-1">
{{ content }}
  </main>
  {% include footer.html %}
  <script src="/assets/js/mouse.js?v={{ site.time | date: '%s' }}" defer></script>
  <script src="/assets/js/site.js?v={{ site.time | date: '%s' }}" defer></script>
  {%- for s in page.scripts %}
  <script src="{{ s }}?v={{ site.time | date: '%s' }}" defer></script>
  {%- endfor %}
</body>
</html>
