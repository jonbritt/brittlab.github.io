# Current lab members, shown on the People page.
#
# To add someone, copy a block and fill in what you have. Everything except
# name and group is optional:
#   photo:        file in assets/img/people/ (square-ish, ~600px). Leave empty for the mouse placeholder.
#   interests_en / interests_fr:  one or two sentences. Leave empty to show "coming soon".
#   email, website:  shown as small links on the card.
#   author:       how the name appears in author lists (e.g. "Morris MM"), so the
#                 Publications page can highlight current members.
#
# group must be one of: phd, msc, undergrad, postdoc, staff
# (phd and msc are shown together under "Graduate Students"; each card still
# says Ph.D. Student or M.Sc. Student)

