pi:
  title: Jonathan Britt
  meta_description: >-
    Jonathan P. Britt, Ph.D., Associate Professor of Psychology at McGill
    University and Canada Research Chair in Behavioural Neuroscience.
  name: Jonathan Britt, Ph.D.
  position: Associate Professor, Department of Psychology, McGill University
  chair: Canada Research Chair (Tier 2) in Behavioural Neuroscience
  portrait_alt: Portrait of Jonathan Britt
  bio_label: Biography
  # verbatim (old Lab Members page)
  bio: >-
    Jonathan Britt started the Britt Lab for Neural Circuits, Motivation, and
    Reinforcement Learning when he became an Assistant Professor at McGill
    University in 2014. Earlier in his career, Jon worked as a Research Fellow in
    the lab of Antonello Bonci at both UCSF (Gallo Center) and the National
    Institute on Drug Abuse in Baltimore. Jon earned his Ph.D. at the University
    of Chicago in the lab of Dan McGehee. His introduction to neuroscience
    research began during his undergraduate studies at Colorado College under the
    mentorship of Bob Jacobs.
  bio_2: >-
    Jon is now an Associate Professor in McGill's Department of Psychology and
    holds a Canada Research Chair (Tier 2) in Behavioural Neuroscience, funded by
    the Canadian Institutes of Health Research and renewed in 2025. He trains
    graduate students through the Department of Psychology and McGill's
    Integrated Program in Neuroscience, and is affiliated with the Center for
    Studies in Behavioral Neurobiology at Concordia University.
  bio_3: >-
    As a graduate student, Jon studied how presynaptic opioid and nicotinic
    receptors regulate dopamine release in the nucleus accumbens. As a
    postdoctoral fellow, he used optogenetics to compare the synaptic and
    behavioural profiles of hippocampal, amygdala and prefrontal inputs to the
    nucleus accumbens, work that set the direction of the Britt Lab. Since then
    the lab has shown how these inputs coordinate feeding, enhance food
    palatability, and suppress unproductive reward seeking, and how dopamine
    signalling maintains learned values and limits the duration of reinforced
    actions.
  timeline_label: Path
  timeline:
    - place: Colorado College
      what: Undergraduate research with Bob Jacobs
    - place: University of Chicago
      what: Ph.D., lab of Dan McGehee
    - place: UCSF Gallo Center and NIDA, Baltimore
      what: Research Fellow, lab of Antonello Bonci
    - place: McGill University, 2014
      what: Assistant Professor; founds the Britt Lab
    - place: McGill University
      what: Associate Professor, Department of Psychology
    - place: Canada Research Chair, 2025
      what: Tier 2 Chair in Behavioural Neuroscience renewed
