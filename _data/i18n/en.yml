join:
  title: Join us
  meta_description: >-
    Opportunities for graduate students, undergraduate researchers and
    postdoctoral fellows in the Britt Lab at McGill University.
  lede: >-
    We study the circuits behind motivation with optogenetics, fiber photometry
    and carefully designed behaviour, and we're always glad to hear from curious
    people.
  sections:
    - title: Graduate students
      text: >-
        Prospective M.Sc. and Ph.D. students apply through McGill's Department of
        Psychology or the Integrated Program in Neuroscience. Please email Jon
        before applying with your CV, your transcripts, and a few sentences about
        which of the lab's questions interest you.
    - title: Undergraduate researchers
      text: >-
        McGill undergraduates join the lab through independent research courses.
        Past members have completed PSYC 380, 395, 396, 450, 494, 496 and 498,
        NSCI 420 and 430, and COGS 396, 401 and 444 projects, as well as summer
        research through SURA, PURA, ARIA and NSERC USRA awards.
    - title: Postdoctoral fellows
      text: >-
        If you'd like to study the circuit basis of motivation and learning,
        get in touch to talk about projects and fellowship applications.
  contact_title: Get in touch
  contact_text: >-
    Email Jon directly. The lab is in the Stewart Biology Building on McGill's
    downtown campus.
  email_cta: Email Jonathan Britt

