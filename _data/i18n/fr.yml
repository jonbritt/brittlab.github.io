home:
  meta_description: >-
    Le Laboratoire Britt de l’Université McGill étudie comment le noyau accumbens
    et ses afférences façonnent la motivation, la recherche de récompenses,
    l’alimentation et l’apprentissage par renforcement.
  eyebrow: Département de psychologie · Université McGill
  title: Laboratoire Britt sur les circuits neuronaux, la motivation et l'apprentissage par renforcement
  # traduction fidèle du texte original
  lede: >-
    Le Laboratoire Britt étudie les circuits neuronaux qui régulent des processus
    psychologiques fondamentaux, comme la motivation et l’apprentissage par
    renforcement.
  cta_research: Nos recherches
  cta_people: Rencontrer l’équipe
  welcome_label: Bienvenue
  # traduction fidèle du texte original
  welcome: >-
    Nous souhaitons découvrir les mécanismes neurobiologiques qui sous-tendent
    les pensées et les actions compulsives. Nous nous intéressons également aux
    fondements neurobiologiques du plaisir. Les connaissances issues de ces
    travaux contribueront aux efforts visant à élucider la physiopathologie de
    divers troubles psychiatriques chez l’humain, notamment la dépendance, le
    trouble obsessionnel-compulsif, la schizophrénie et le syndrome de Gilles de
    la Tourette.
  welcome_signature: Jonathan Britt, Ph. D.
  questions_label: Nos questions de recherche
  questions_title: Une petite structure où se rencontrent contexte, émotion et motivation.
  questions:
    - title: Qu’encodent les afférences du noyau accumbens ?
      text: >-
        Les afférences hippocampiques, amygdaliennes, thalamiques et corticales
        convergent vers le noyau accumbens. Nous enregistrons et manipulons
        l’activité de chaque voie pour déterminer quand elle est active et quand
        elle influence le comportement.
      refs: Reed et al., Neuron 2018 · Lafferty et al., Cell Rep. 2020
    - title: Comment le cerveau décide-t-il de manger et d’y prendre plaisir ?
      text: >-
        La prise alimentaire coïncide avec une diminution coordonnée des
        afférences excitatrices vers la portion rostrale de la coquille (shell)
        du noyau accumbens, et les afférences hippocampiques vers la coquille
        augmentent la palatabilité des aliments.
      refs: Reed et al., Neuron 2018 · Yang et al., Biol. Psychiatry 2020
    - title: Qu’enseigne réellement la dopamine ?
      text: >-
        La dopamine évoquée par un indice aide à maintenir les associations
        indice–valeur sans déterminer la valeur attendue, et la dopamine dans la
        coquille du noyau accumbens renforce les actions tout en limitant leur
        durée.
      refs: Mendoza et al., Cell Rep. 2019 · Valyear et al., bioRxiv 2023
    - title: Comment freiner la recherche infructueuse de récompenses ?
      text: >-
        Les deux principaux types de cellules du noyau accumbens, ainsi que les
        afférences amygdaliennes et thalamiques, sont nécessaires pour cesser de
        répondre lorsque la récompense n’est pas disponible : leurs rôles sont
        complémentaires plutôt qu’opposés.
      refs: Lafferty et al., Cell Rep. 2020
  approach_label: Approche
  approach_title: Une approche propre à chaque voie, avec une précision de l’ordre de la milliseconde.
  # traduction fidèle du texte original (deux paragraphes)
  approach: >-
    Pour découvrir les processus neurobiologiques qui motivent et orientent le
    comportement volontaire, nous combinons des méthodes de pointe, comme le
    transfert intracrânien de gènes par vecteurs viraux, l’optogénétique et
    l’imagerie calcique, avec des paradigmes comportementaux simples chez les
    rongeurs, comme le conditionnement pavlovien et opérant.
  approach_2: >-
    Nos travaux actuels visent principalement à comprendre la physiologie et la
    fonction du noyau accumbens, une structure du prosencéphale qui intègre des
    indices contextuels, émotionnels et motivationnels pour déclencher et
    coordonner la recherche de récompenses.
  methods:
    - title: Transfert de gènes par vecteurs viraux
      text: Des protéines photosensibles et des capteurs de calcium ciblant des types cellulaires et des voies définis.
    - title: Optogénétique
      text: Activation ou inhibition de voies précises par la lumière, synchronisée avec le comportement.
    - title: Photométrie par fibre optique
      text: Enregistrement de l’activité calcique d’axones appartenant à des voies définies chez des souris en cours de tâche comportementale.
    - title: Conditionnement pavlovien et opérant
      text: Des tâches simples et bien contrôlées qui distinguent la recherche de récompenses, la consommation et l’apprentissage.
  approach_figure_caption: Profils d’innervation du noyau accumbens propres à chaque voie.
  selected_label: Travaux choisis
  selected_title: Articles récents du laboratoire
  gallery_label: Au laboratoire
  gallery_title: Images et données
  gallery_text: >-
    Coupes en microscopie confocale, équipement de laboratoire, figures tirées
    de nos articles et visualisations interactives de jeux de données publiés.
  gallery_cta: Explorer la galerie
  news_label: Nouvelles
  news_cta: Toutes les nouvelles
  join_title: Qu’est-ce qui sous-tend les comportements motivés ?
  join_text: >-
    Nous accueillons des personnes aux études supérieures et au premier cycle
    qui souhaitent faire de la recherche en psychologie, en neurosciences et en
    sciences cognitives.
