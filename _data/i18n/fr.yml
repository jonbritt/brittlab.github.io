pi:
  title: Jonathan Britt
  meta_description: >-
    Jonathan P. Britt, Ph. D., professeur agrégé de psychologie à l’Université
    McGill et titulaire de la Chaire de recherche du Canada en neurosciences
    comportementales.
  name: Jonathan Britt, Ph. D.
  position: Professeur agrégé, Département de psychologie, Université McGill
  chair: Chaire de recherche du Canada (niveau 2) en neurosciences comportementales
  portrait_alt: Portrait de Jonathan Britt
  bio_label: Biographie
  # traduction fidèle du texte original (ancienne page « Membres du laboratoire »)
  bio: >-
    Jonathan Britt a fondé le Laboratoire Britt sur les circuits neuronaux, la
    motivation et l’apprentissage par renforcement lorsqu’il est devenu
    professeur adjoint à l’Université McGill en 2014. Auparavant, Jon a été
    chercheur dans le laboratoire d’Antonello Bonci, à l’UCSF (Gallo Center) et
    au National Institute on Drug Abuse à Baltimore. Jon a obtenu son Ph. D. à
    l’Université de Chicago, dans le laboratoire de Dan McGehee. Son initiation
    à la recherche en neurosciences a commencé pendant ses études de premier
    cycle au Colorado College, sous le mentorat de Bob Jacobs.
  bio_2: >-
    Jon est maintenant professeur agrégé au Département de psychologie de
    l’Université McGill et titulaire d’une Chaire de recherche du Canada
    (niveau 2) en neurosciences comportementales, financée par les Instituts de
    recherche en santé du Canada et renouvelée en 2025. Il encadre des personnes
    aux études supérieures au Département de psychologie et au Programme intégré
    en neurosciences de McGill, et est affilié au Centre d’études en
    neurobiologie comportementale de l’Université Concordia.
  bio_3: >-
    Pendant ses études supérieures, Jon a étudié comment les récepteurs
    présynaptiques opioïdes et nicotiniques régulent la libération de dopamine
    dans le noyau accumbens. Lors de son stage postdoctoral, il a utilisé
    l’optogénétique pour comparer les profils synaptiques et comportementaux des
    afférences hippocampiques, amygdaliennes et préfrontales du noyau accumbens,
    des travaux qui ont orienté les recherches du Laboratoire Britt. Depuis, le
    laboratoire a montré comment ces afférences coordonnent la prise alimentaire,
    augmentent la palatabilité des aliments et inhibent la recherche infructueuse
    de récompenses, ainsi que la façon dont la signalisation dopaminergique
    maintient les valeurs apprises et limite la durée des actions renforcées.
  timeline_label: Parcours
  timeline:
    - place: Colorado College
      what: Recherche au premier cycle avec Bob Jacobs
    - place: Université de Chicago
      what: Ph. D., laboratoire de Dan McGehee
    - place: Gallo Center de l’UCSF et NIDA, Baltimore
      what: Chercheur, laboratoire d’Antonello Bonci
    - place: Université McGill, 2014
      what: Professeur adjoint ; fondation du Laboratoire Britt
    - place: Université McGill
      what: Professeur agrégé, Département de psychologie
    - place: Chaire de recherche du Canada, 2025
      what: Renouvellement de la chaire de niveau 2 en neurosciences comportementales
