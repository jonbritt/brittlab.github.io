research:
  title: Recherche
  meta_description: >-
    Comment le noyau accumbens et ses afférences encodent et contrôlent la
    recherche de récompenses, l’alimentation, l’apprentissage dépendant de la
    dopamine et l’inhibition comportementale.
  eyebrow: Objectifs de recherche
  # traduction fidèle du texte original (trois paragraphes de l’ancienne page « Objectifs de recherche »)
  lede: >-
    Le noyau accumbens est une région bien étudiée du prosencéphale qui influence
    l’ardeur avec laquelle les animaux recherchent des récompenses ainsi que le
    plaisir qu’ils tirent de leur consommation. Il régule les processus
    motivationnels et l’apprentissage par renforcement. Une signalisation
    anormale dans le noyau accumbens a été associée à divers troubles
    psychiatriques, dont la dépendance, le trouble obsessionnel-compulsif et la
    schizophrénie. On considère généralement que cette structure intègre des
    indices contextuels, émotionnels et motivationnels pour déclencher et
    coordonner la recherche de récompenses.
  aims_1: >-
    Le Laboratoire Britt cherche actuellement à comprendre quels types
    d’information sont encodés dans les différentes afférences du noyau
    accumbens, ainsi que la manière dont cette information est finalement
    intégrée dans un plan d’action. Nous espérons établir précisément à quels
    moments chaque afférence de cette structure intégratrice est à la fois
    active et déterminante pour le comportement. Pour répondre à ces questions,
    le Laboratoire Britt étudie les rongeurs et utilise des techniques d’imagerie
    calcique, comme la photométrie par fibre optique, en combinaison avec des
    manipulations optogénétiques. Notre objectif est de comprendre la relation
    causale entre l’activité des circuits neuronaux et le comportement, avec une
    précision de l’ordre de la milliseconde et propre à chaque voie.
  aims_2: >-
    Le Laboratoire Britt cherche également à comprendre comment l’activité des
    circuits neuronaux propres à chaque voie est altérée dans des modèles de
    psychopathologie chez les rongeurs, ainsi que ses changements en réponse à
    des médicaments couramment utilisés. Les connaissances issues de ce type
    d’approche de cartographie des circuits neuronaux ont déjà servi à mettre au
    point des interventions thérapeutiques hautement ciblées, conçues pour
    améliorer la vie des personnes atteintes de maladies mentales.
  figure_caption: >-
    Profils d’innervation du noyau accumbens propres à chaque voie, tirés de
    l’ancienne page de recherche du laboratoire.
  themes_label: Thèmes de recherche
  themes:
    - id: inputs
      title: Afférences du noyau accumbens
      text: >-
        Le noyau accumbens reçoit des afférences excitatrices de l’hippocampe
        ventral, de l’amygdale basolatérale, du thalamus médian et du cortex
        préfrontal. En comparant directement ces voies, les travaux postdoctoraux
        de Jon ont montré que les afférences hippocampiques se concentrent dans
        la coquille médiale et que l’activation de n’importe laquelle de ces
        voies suffit à renforcer le comportement. Au laboratoire, la photométrie
        par fibre optique d’axones appartenant à des voies définies a montré que
        les portions rostrale et caudale de la coquille sont innervées par des
        populations distinctes et entremêlées de neurones du prosencéphale, et
        que chaque afférence véhicule un mélange de signaux opposés pendant la
        recherche de récompenses.
      papers: ["10.1016/j.neuron.2018.07.051", "10.1016/j.celrep.2020.02.095"]
      image: research/nac-input-innervation.jpg
      image_caption: Innervation du noyau accumbens par différentes voies afférentes.
    - id: feeding
      title: Alimentation et palatabilité
      text: >-
        La consommation coïncide avec une réduction coordonnée, à l’échelle du
        réseau, de l’activité excitatrice afférente à la portion rostrale de la
        coquille du noyau accumbens, et la réduction des afférences d’une seule
        voie suffit à favoriser la prise alimentaire. En mesurant la
        palatabilité à partir de la microstructure du léchage, le laboratoire a
        montré qu’une stimulation à basse fréquence des afférences de
        l’hippocampe ventral vers la coquille augmente la palatabilité d’un
        aliment, indépendamment de la signalisation opioïde, et peut conditionner
        une préférence pour une saveur. Cette même approche d’analyse de la
        microstructure du léchage montre que la palatabilité de l’alcool et des
        saveurs qui lui sont associées augmente avec la consommation répétée.
      papers: ["10.1016/j.neuron.2018.07.051", "10.1016/j.biopsych.2019.09.007", "10.1016/j.physbeh.2024.114500"]
      image: research/mouse-optogenetic.jpg
      image_caption: >-
        Stimulation optique des circuits de l’accumbens, de l’amygdale et de
        l’ATV chez la souris. Illustration tirée de l’ancienne galerie du
        laboratoire.
    - id: dopamine
      title: Dopamine, valeur et désengagement
      text: >-
        La manipulation optogénétique bidirectionnelle des neurones
        dopaminergiques pendant une tâche de choix par essais a montré que la
        dopamine évoquée par un indice aide à maintenir les associations
        indice–valeur, mais n’encode pas la valeur attendue. Des travaux plus
        récents montrent que la dopamine dans la coquille médiale du noyau
        accumbens renforce les actions tout en limitant leur durée, par
        l’intermédiaire de la signalisation des récepteurs D1.
      papers: ["10.1016/j.celrep.2019.09.077", "10.1101/2023.11.29.569116"]
      image: gallery/fig-mendoza-2019-dopamine.jpg
      image_caption: >-
        Activité des neurones dopaminergiques lors de la présentation du levier,
        de l’appui sur le levier et de la récompense. Mendoza et al., Cell Reports
        2019, fig. 1 (CC BY 4.0).
    - id: suppression
      title: Freiner la recherche infructueuse de récompenses
      text: >-
        Une recherche efficace de récompenses exige de savoir quand ne pas
        répondre. Les neurones des voies directe et indirecte du noyau accumbens
        sont tous deux plus actifs lorsque le comportement est inhibé, et
        l’inhibition de l’un ou l’autre type augmente les réponses infructueuses.
        Les afférences amygdaliennes et thalamiques, qui innervent différentes
        sous-régions du noyau accumbens, sont également toutes deux nécessaires,
        ce qui indique des processus complémentaires plutôt qu’opposés.
      papers: ["10.1016/j.celrep.2020.02.095"]
      image: gallery/fig-lafferty-2020-anatomy.jpg
      image_caption: >-
        Les axones thalamiques (PVT) et amygdaliens (BLA) innervent des régions
        distinctes du noyau accumbens. Lafferty et al., Cell Reports 2020, fig. 3
        (CC BY-NC-ND 4.0).
    - id: tools
      title: Des outils plus précis pour l’étude des circuits neuronaux
      text: >-
        L’inhibition des terminaisons axonales par l’archaerhodopsine est
        largement utilisée pour évaluer la contribution de chaque voie au
        comportement. Le laboratoire a montré qu’elle augmente également la
        libération spontanée de neurotransmetteurs et recrute l’inhibition
        locale, produisant les mêmes effets comportementaux quelle que soit la
        voie ciblée, et que l’inhibition des corps cellulaires constitue une
        solution plus spécifique. Un article de synthèse présente des approches
        entièrement optiques qui permettent d’enregistrer et de manipuler
        simultanément l’activité des circuits.
      papers: ["10.3389/fncir.2020.00010", "10.1016/j.ymeth.2021.07.007"]
      image: gallery/fig-lafferty-2020-archt.jpg
      image_caption: >-
        Inhibition des axones thalamiques et amygdaliens dans le noyau accumbens
        par ArchT. Lafferty et Britt, Front. Neural Circuits 2020, fig. 1
        (CC BY 4.0).
  collab_label: Collaborations
  collab_title: Collaborer avec des collègues de toute l’Université McGill
  collabs:
    - title: Sérotonine et intensité de l’attention
      text: >-
        La dynamique rapide des neurones sérotoninergiques du raphé dorsal
        régule l’intensité de l’attention que les souris portent à des cibles
        visuelles.
      doi: "10.1038/s41467-026-70658-y"
    - title: Psychédéliques et comportement social
      text: >-
        L’administration répétée de LSD favorise le comportement social chez les
        souris, un effet qui nécessite mTORC1 dans les neurones excitateurs.
      doi: "10.1073/pnas.2020705118"
    - title: Régulation épigénétique des gènes de prédisposition à l’autisme
      text: >-
        La perte de la protéine de liaison aux dinucléotides CpG méthylés Mbd2
        modifie l’expression des gènes dans l’hippocampe et entraîne des déficits
        cognitifs, sociaux et émotionnels.
      doi: "10.1038/s41398-023-02561-9"
  key_papers: Articles clés

