  meta_description: >-
    Possibilités de recherche aux cycles supérieurs, au premier cycle et au
    postdoctorat au Laboratoire Britt de l’Université McGill.
  lede: >-
    Nous étudions les circuits de la motivation au moyen de l’optogénétique, de
    la photométrie par fibre optique et de tâches comportementales
    soigneusement conçues, et nous avons toujours plaisir à échanger avec des
    personnes curieuses.
  sections:
    - title: Études supérieures
      text: >-
        Les candidatures à la M. Sc. et au Ph. D. se font par l’intermédiaire du
        Département de psychologie ou du Programme intégré en neurosciences de
        McGill. Avant de présenter votre candidature, veuillez envoyer à Jon un
        courriel comprenant votre CV, vos relevés de notes et quelques phrases
        sur les questions de recherche du laboratoire qui vous intéressent.
    - title: Recherche au premier cycle
      text: >-
        Les personnes au premier cycle à McGill se joignent au laboratoire dans
        le cadre de cours de recherche individuelle. Des membres ont déjà
        réalisé des projets dans les cours PSYC 380, 395, 396, 450, 494, 496 et
        498, NSCI 420 et 430, ainsi que COGS 396, 401 et 444, en plus de travaux
        de recherche d’été financés par les bourses SURA, PURA, ARIA et
        NSERC USRA (BRPC du CRSNG).
    - title: Stages postdoctoraux
      text: >-
        Si vous souhaitez étudier les circuits à la base de la motivation et de
        l’apprentissage, communiquez avec nous pour discuter de projets et de
        demandes de bourses.
  contact_title: Communiquez avec nous
  contact_text: >-
    Écrivez directement à Jon. Le laboratoire se trouve au pavillon de biologie
    Stewart, sur le campus du centre-ville de McGill.
  email_cta: Écrire à Jonathan Britt

