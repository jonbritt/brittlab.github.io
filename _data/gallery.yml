    alt_fr: Figure montrant le montage de photométrie, des cartes thermiques et des tracés de l'activité des neurones dopaminergiques.
    caption_en: Phasic dopamine neuron activity during lever presentations, lever pressing and reward.
    caption_fr: Activité phasique des neurones dopaminergiques lors de la présentation du levier, de l'appui et de la récompense.
    credit: Mendoza et al., Cell Reports 2019, Fig. 1
    license: CC BY 4.0
    doi: 10.1016/j.celrep.2019.09.077

  - slug: fig-lafferty-2020-archt
    category: figures
    title_en: Silencing accumbens inputs with light
    title_fr: Inhiber les afférences de l'accumbens par la lumière
    alt_en: Schematics and confocal images of ArchT expression in thalamic and amygdala axons in the nucleus accumbens, with behavioural results.
    alt_fr: Schémas et images confocales de l'expression d'ArchT dans les axones thalamiques et amygdaliens de l'accumbens, avec résultats comportementaux.
    caption_en: ArchT-mediated axon terminal inhibition of glutamate afferents in the nucleus accumbens.
    caption_fr: Inhibition des terminaisons axonales glutamatergiques de l'accumbens par ArchT.
    credit: Lafferty & Britt, Frontiers in Neural Circuits 2020, Fig. 1
    license: CC BY 4.0
    doi: 10.3389/fncir.2020.00010

  - slug: fig-lafferty-2020-anatomy
    category: figures
    title_en: Two inputs, two territories
    title_fr: Deux afférences, deux territoires
    alt_en: Red and green fluorescent images showing thalamic and amygdala axons in different parts of the nucleus accumbens, with quantification.
    alt_fr: Images fluorescentes rouges et vertes montrant les axones thalamiques et amygdaliens dans différentes parties de l'accumbens, avec quantification.
    caption_en: PVT and BLA neurons innervate distinct areas of the nucleus accumbens.
    caption_fr: Les neurones du PVT et de la BLA innervent des régions distinctes du noyau accumbens.
    credit: Lafferty et al., Cell Reports 2020, Fig. 3
    license: CC BY-NC-ND 4.0
    doi: 10.1016/j.celrep.2020.02.095

  - slug: fig-lehnert-2026-dynamics
    category: figures
    title_en: Serotonin signals during a task
    title_fr: Signaux sérotoninergiques pendant une tâche
    alt_en: Figure showing the task, fiber photometry from dorsal raphe neurons, and activity aligned to trial events.
    alt_fr: Figure montrant la tâche, la photométrie des neurones du raphé dorsal et l'activité alignée sur les événements des essais.
    caption_en: Dorsal raphe signals encode trial events and outcomes.
    caption_fr: Les signaux du raphé dorsal encodent les événements et les issues des essais.
    credit: Lehnert et al., Nature Communications 2026, Fig. 2
    license: CC BY 4.0
    doi: 10.1038/s41467-026-70658-y

  - slug: fig-lafferty-2020-controls
    category: figures
    title_en: An off-target effect, measured
    title_fr: Un effet hors cible, mesuré
    alt_en: Slice recording schematics and traces showing increased spontaneous release and interneuron activity during ArchT illumination.
    alt_fr: Schémas et tracés d'enregistrements en tranche montrant l'augmentation de la libération spontanée et de l'activité des interneurones sous illumination d'ArchT.
    caption_en: ArchT inhibition of excitatory axons increases spontaneous release and recruits local interneurons.
    caption_fr: L'inhibition des axones excitateurs par ArchT augmente la libération spontanée et recrute les interneurones locaux.
    credit: Lafferty & Britt, Frontiers in Neural Circuits 2020, Fig. 3
    license: CC BY 4.0
    doi: 10.3389/fncir.2020.00010

  - slug: fig-lax-2023-behaviour
    category: figures
    title_en: Behaviour without Mbd2
    title_fr: Comportement sans Mbd2
    alt_en: Bar charts comparing wild-type and Mbd2-deficient mice across behavioural tests.
    alt_fr: Histogrammes comparant des souris de type sauvage et déficientes en Mbd2 dans plusieurs tests comportementaux.
    caption_en: Behavioural effects of Mbd2 deficiency.
    caption_fr: Effets comportementaux de la déficience en Mbd2.
    credit: Lax et al., Translational Psychiatry 2023, Fig. 1
