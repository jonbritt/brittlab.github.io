  - slug: fig-lehnert-2026-attention
    category: figures
    title_en: Serotonin and visual attention
    title_fr: Sérotonine et attention visuelle
    alt_en: Multi-panel figure showing dorsal raphe sections and behavioural effects of optogenetic excitation and suppression on attention.
    alt_fr: Figure à plusieurs panneaux montrant des coupes du raphé dorsal et les effets comportementaux de l'excitation et de la suppression optogénétiques sur l'attention.
    caption_en: Dorsal raphe serotonin neurons regulate visual attention.
    caption_fr: Les neurones sérotoninergiques du raphé dorsal régulent l'attention visuelle.
    credit: Lehnert et al., Nature Communications 2026, Fig. 4
    license: CC BY 4.0
    doi: 10.1038/s41467-026-70658-y

  - slug: fig-mendoza-2019-dopamine
