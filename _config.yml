title: Britt Lab
description: >-
  The Britt Lab for Neural Circuits, Motivation, and Reinforcement Learning
  studies how the nucleus accumbens and its inputs shape reward seeking,
  feeding and learning. Department of Psychology, McGill University.
url: "https://brittlab.ca"
baseurl: ""
lang: en
# No GitHub Pages theme: the site ships its own layouts and CSS
theme: null
timezone: America/Montreal

author:
  name: Jonathan P. Britt
  email: jonathan.britt@mcgill.ca

contact:
  email: jonathan.britt@mcgill.ca
  phone: "514-398-3625"
  office: Stewart Biology Building, N8/9
  street: 1205 Dr Penfield Avenue
  city: Montréal, QC H3A 1B1
  orcid: https://orcid.org/0000-0003-3044-9565
  pubmed: https://pubmed.ncbi.nlm.nih.gov/?term=Britt+JP%5BAuthor%5D
  mcgill_profile: https://www.mcgill.ca/psychology/jonathan-britt

permalink: /news/:year/:title/
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]

plugins:
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: news/feed.xml

defaults:
  - scope:
      path: ""
    values:
      lang: en
  - scope:
      path: "fr"
    values:
      lang: fr
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - tools
  - .bundle
  - node_modules
